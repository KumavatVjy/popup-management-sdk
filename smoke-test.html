<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Popup Manager SDK — Smoke Test</title>
  <style>
    body { font-family: sans-serif; margin: 40px; }
    .status-pass { color: #059669; font-weight: bold; }
    .status-fail { color: #dc2626; font-weight: bold; }
  </style>
</head>
<body>
  <h1>Popup Manager SDK — Browser Smoke Test</h1>
  <p id="status">Loading SDK...</p>

  <script src="dist/popup-manager.min.js"></script>
  <script>
    const statusEl = document.getElementById('status');
    if (typeof window.PopupManager !== 'undefined' && window.PopupManager.version === '0.1.0') {
      statusEl.className = 'status-pass';
      statusEl.textContent = 'PASS: window.PopupManager detected with version ' + window.PopupManager.version;
    } else {
      statusEl.className = 'status-fail';
      statusEl.textContent = 'FAIL: window.PopupManager global was not found or has incorrect version';
    }
  </script>
</body>
</html>
