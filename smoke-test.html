<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Popup Manager SDK — Smoke Test</title>
  <style>
    body { font-family: sans-serif; margin: 40px; }
    .status-pass { color: #059669; font-weight: bold; }
    .status-fail { color: #dc2626; font-weight: bold; }
  </style>
</head>
<body>
  <h1>Popup Manager SDK — Browser Smoke Test</h1>
  <p id="status">Loading SDK...</p>
  <pre id="output"></pre>

  <script src="dist/popup-manager.min.js"></script>
  <script>
    const statusEl = document.getElementById('status');
    const outputEl = document.getElementById('output');

    async function runSmokeTest() {
      try {
        if (
          typeof window.PopupManager !== 'undefined' &&
          window.PopupManager.version === '0.1.0' &&
          typeof window.PopupManager.init === 'function' &&
          typeof window.PopupManager.load === 'function'
        ) {
          window.PopupManager.init({
            websiteKey: 'wg_live_browser_smoke_test',
            apiBaseUrl: window.location.origin || 'http://localhost:8082',
            autoLoad: true,
            autoShow: true,
          });

          statusEl.className = 'status-pass';
          statusEl.textContent = 'PASS: window.PopupManager detected (v' + window.PopupManager.version + ') and initialized with load() method available';
        } else {
          statusEl.className = 'status-fail';
          statusEl.textContent = 'FAIL: window.PopupManager global was not found or init/load methods are missing';
        }
      } catch (e) {
        statusEl.className = 'status-fail';
        statusEl.textContent = 'FAIL: Error during test: ' + e.message;
      }
    }

    runSmokeTest();
  </script>
</body>
</html>
